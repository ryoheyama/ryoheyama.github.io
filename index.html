<title>Health Data Sync</title>
<h1>Health Data Sync</h1>
<p>個人が自分のデータを自分の Google Drive に保存するための個人用ツールです。一般には提供していません。</p>
<h2>プライバシーポリシー</h2>
<p>このツールは Google Drive の drive.file 権限で、ツール自身が作成したファイルだけを読み書きします。データは利用者本人の Google Drive にだけ保存し、第三者に提供・共有しません。</p>
